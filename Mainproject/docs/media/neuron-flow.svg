<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="DM Sans, Helvetica, Arial, sans-serif">
<rect width="1240" height="880" fill="#14110e"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5a694"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d4a35a"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c76b52"/></marker>
</defs>
<text x="40" y="52" fill="#f3ebe0" font-size="27" font-weight="600" font-family="Georgia, serif">How the signal actually flows</text>
<text x="40" y="78" fill="#b5a694" font-size="15">Two circuits. One decides what to cook; the other decides whether a fly is able to work.</text>
<rect x="28" y="104" width="1184" height="326" rx="14" fill="none" stroke="#3d3228"/>
<text x="52" y="136" fill="#d4a35a" font-size="17" font-weight="600">1   ORDER DESK — an order becomes a smell</text>
<text x="52" y="158" fill="#b5a694" font-size="13.5">Mushroom body. The learning rule is real; this circuit’s wiring is a stand-in sized after MaleCNS.</text>
<rect x="52" y="186" width="150" height="78" rx="9" fill="#1c1713" stroke="#3d3228" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="127.0" y="219.0" fill="#d4a35a" font-size="19" font-weight="600" text-anchor="middle">Order</text>
<text x="127.0" y="241.0" fill="#b5a694" font-size="14" text-anchor="middle">chicken · spicy</text>
<text x="127.0" y="258.0" fill="#b5a694" font-size="14" text-anchor="middle">hyderabadi · raita</text>
<line x1="208" y1="225.0" x2="254" y2="225.0" stroke="#b5a694" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="231.0" y="214.0" fill="#b5a694" font-size="13" text-anchor="middle">hash</text>
<rect x="260" y="186" width="128" height="78" rx="9" fill="#1c1713" stroke="#3d3228" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="324.0" y="219.0" fill="#f3ebe0" font-size="19" font-weight="600" text-anchor="middle">128 PN</text>
<text x="324.0" y="241.0" fill="#b5a694" font-size="14" text-anchor="middle">projection</text>
<text x="324.0" y="258.0" fill="#b5a694" font-size="14" text-anchor="middle">neurons</text>
<line x1="394" y1="225.0" x2="440" y2="225.0" stroke="#b5a694" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="446" y="186" width="188" height="78" rx="9" fill="#1c1713" stroke="#3d3228" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="540.0" y="219.0" fill="#f3ebe0" font-size="19" font-weight="600" text-anchor="middle">400 KC</text>
<text x="540.0" y="241.0" fill="#b5a694" font-size="14" text-anchor="middle">k-winners-take-all 6%</text>
<text x="540.0" y="258.0" fill="#b5a694" font-size="14" text-anchor="middle">+ APL global inhibition</text>
<line x1="640" y1="225.0" x2="686" y2="225.0" stroke="#b5a694" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="663.0" y="214.0" fill="#b5a694" font-size="13" text-anchor="middle">sparse</text>
<rect x="692" y="186" width="150" height="78" rx="9" fill="#1c1713" stroke="#6fa892" stroke-width="1.4"/>
<text x="767.0" y="219.0" fill="#6fa892" font-size="19" font-weight="600" text-anchor="middle">24 active</text>
<text x="767.0" y="241.0" fill="#b5a694" font-size="14" text-anchor="middle">the Kenyon-cell</text>
<text x="767.0" y="258.0" fill="#b5a694" font-size="14" text-anchor="middle">code for this order</text>
<line x1="848" y1="225.0" x2="894" y2="225.0" stroke="#b5a694" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="900" y="186" width="128" height="78" rx="9" fill="#1c1713" stroke="#3d3228" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="964.0" y="219.0" fill="#f3ebe0" font-size="19" font-weight="600" text-anchor="middle">48 MBON</text>
<text x="964.0" y="241.0" fill="#b5a694" font-size="14" text-anchor="middle">push–pull</text>
<text x="964.0" y="258.0" fill="#b5a694" font-size="14" text-anchor="middle">readout</text>
<line x1="1034" y1="225.0" x2="1080" y2="225.0" stroke="#b5a694" stroke-width="1.8" marker-end="url(#ar)"/>
<rect x="1086" y="186" width="102" height="78" rx="9" fill="#1c1713" stroke="#3d3228" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="1137.0" y="219.0" fill="#d4a35a" font-size="19" font-weight="600" text-anchor="middle">valence</text>
<text x="1137.0" y="241.0" fill="#b5a694" font-size="14" text-anchor="middle">how she</text>
<text x="1137.0" y="258.0" fill="#b5a694" font-size="14" text-anchor="middle">feels</text>
<path d="M767 264 L767 298 L500 298" stroke="#6fa892" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="790" y="294" fill="#6fa892" font-size="14" font-weight="600">that code IS the ticket sent to the kitchen</text>
<path d="M1137 264 L1137 358 L540 358" stroke="#c76b52" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="700" y="352" fill="#c76b52" font-size="14">dopamine: served → reward, remade → punish — moves only the synapses those 24 cells used</text>
<rect x="28" y="460" width="1184" height="330" rx="14" fill="none" stroke="#3d3228"/>
<text x="52" y="492" fill="#d4a35a" font-size="17" font-weight="600">2   KITCHEN FLOOR — standing at a station becomes work</text>
<text x="52" y="514" fill="#6fa892" font-size="13.5">Real traced connectome. 150 MaleCNS v1.0 neurons, 2,224 measured synaptic contacts. Solid boxes are measured cells.</text>
<rect x="52" y="544" width="168" height="78" rx="9" fill="#1c1713" stroke="#3d3228" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="136.0" y="577.0" fill="#f3ebe0" font-size="19" font-weight="600" text-anchor="middle">Fly arrives</text>
<text x="136.0" y="599.0" fill="#b5a694" font-size="14" text-anchor="middle">position AND speed</text>
<text x="136.0" y="616.0" fill="#b5a694" font-size="14" text-anchor="middle">must both agree</text>
<line x1="226" y1="583.0" x2="272" y2="583.0" stroke="#d4a35a" stroke-width="1.8" marker-end="url(#arg)"/>
<text x="249.0" y="572.0" fill="#d4a35a" font-size="13" text-anchor="middle">0 ms</text>
<rect x="278" y="544" width="160" height="78" rx="9" fill="#1c1713" stroke="#6fa892" stroke-width="1.4"/>
<text x="358.0" y="577.0" fill="#6fa892" font-size="19" font-weight="600" text-anchor="middle">LB3a_R ×8</text>
<text x="358.0" y="599.0" fill="#b5a694" font-size="14" text-anchor="middle">labellar water</text>
<text x="358.0" y="616.0" fill="#b5a694" font-size="14" text-anchor="middle">receptor cells</text>
<line x1="444" y1="583.0" x2="490" y2="583.0" stroke="#d4a35a" stroke-width="1.8" marker-end="url(#arg)"/>
<text x="467.0" y="572.0" fill="#d4a35a" font-size="13" text-anchor="middle">~8 ms</text>
<rect x="496" y="544" width="176" height="78" rx="9" fill="#1c1713" stroke="#6fa892" stroke-width="1.4"/>
<text x="584.0" y="577.0" fill="#6fa892" font-size="19" font-weight="600" text-anchor="middle">relay neurons</text>
<text x="584.0" y="599.0" fill="#b5a694" font-size="14" text-anchor="middle">through real</text>
<text x="584.0" y="616.0" fill="#b5a694" font-size="14" text-anchor="middle">synaptic contacts</text>
<line x1="678" y1="583.0" x2="724" y2="583.0" stroke="#d4a35a" stroke-width="1.8" marker-end="url(#arg)"/>
<text x="701.0" y="572.0" fill="#d4a35a" font-size="13" text-anchor="middle">~25 ms</text>
<rect x="730" y="544" width="168" height="78" rx="9" fill="#1c1713" stroke="#6fa892" stroke-width="1.4"/>
<text x="814.0" y="577.0" fill="#6fa892" font-size="19" font-weight="600" text-anchor="middle">DNg67_R</text>
<text x="814.0" y="599.0" fill="#b5a694" font-size="14" text-anchor="middle">the descending</text>
<text x="814.0" y="616.0" fill="#b5a694" font-size="14" text-anchor="middle">readout neuron</text>
<line x1="904" y1="583.0" x2="950" y2="583.0" stroke="#d4a35a" stroke-width="1.8" marker-end="url(#arg)"/>
<text x="927.0" y="572.0" fill="#d4a35a" font-size="13" text-anchor="middle">fires</text>
<rect x="956" y="544" width="232" height="78" rx="9" fill="#1c1713" stroke="#d4a35a" stroke-width="1.4"/>
<text x="1072.0" y="577.0" fill="#d4a35a" font-size="19" font-weight="600" text-anchor="middle">one tick of work</text>
<text x="1072.0" y="599.0" fill="#b5a694" font-size="14" text-anchor="middle">rice moves toward 70%</text>
<rect x="52" y="668" width="1136" height="64" rx="9" fill="#1a1512" stroke="#c76b52" stroke-width="1.3"/>
<text x="72" y="694" fill="#c76b52" font-size="15" font-weight="600">The control — a button in the running app</text>
<text x="72" y="716" fill="#b5a694" font-size="14">Lesion the sensory cells and the chain breaks at step two. The flies still fly to their stations and stand there. Zero spikes, and the kitchen stalls.</text>
<rect x="52" y="826" width="22" height="13" rx="3" fill="#1c1713" stroke="#6fa892" stroke-width="1.4"/>
<text x="84" y="837" fill="#b5a694" font-size="13.5">measured connectome</text>
<rect x="248" y="826" width="22" height="13" rx="3" fill="#1c1713" stroke="#3d3228" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="280" y="837" fill="#b5a694" font-size="13.5">engineered or stand-in</text>
<text x="1188" y="837" fill="#3d3228" font-size="13" text-anchor="end">MaleCNS v1.0 · FlyEM/HHMI Janelia + Google Research · CC BY 4.0</text>
</svg>